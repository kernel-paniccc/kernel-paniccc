<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="techGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff9d">
        <animate attributeName="stop-color" 
          values="#00ff9d;#00b4ff;#a200ff;#ff0055;#00ff9d"
          dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#00b4ff">
        <animate attributeName="stop-color" 
          values="#00b4ff;#a200ff;#ff0055;#00ff9d;#00b4ff"
          dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <filter id="techGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes codeFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      @keyframes rotate3D {
        0% { transform: perspective(500px) rotateY(0deg); }
        100% { transform: perspective(500px) rotateY(360deg); }
      }
      @keyframes dataFlow {
        from { stroke-dashoffset: 1000; }
        to { stroke-dashoffset: 0; }
      }
      .code-element {
        animation: codeFloat 4s ease-in-out infinite;
      }
      .rotating {
        animation: rotate3D 8s linear infinite;
      }
      .data-stream {
        stroke-dasharray: 10, 5;
        animation: dataFlow 20s linear infinite;
      }
    </style>
  </defs>

  <!-- Central code structure -->
  <g transform="translate(400, 100)" class="rotating">
    <!-- Brackets -->
    <path d="M-30,-40 L-50,-40 L-50,40 L-30,40" 
          fill="none" stroke="url(#techGradient)" stroke-width="3" filter="url(#techGlow)"/>
    <path d="M30,-40 L50,-40 L50,40 L30,40" 
          fill="none" stroke="url(#techGradient)" stroke-width="3" filter="url(#techGlow)"/>
    
    <!-- Code symbols -->
    <text x="0" y="0" fill="url(#techGradient)" font-family="monospace" font-size="24" text-anchor="middle" filter="url(#techGlow)">&lt;/&gt;</text>
  </g>

  <!-- Floating code elements -->
  <g class="code-element" style="animation-delay: -1s">
    <text x="200" y="80" fill="url(#techGradient)" font-family="monospace" font-size="14" filter="url(#techGlow)">
      const dev = new Developer();
    </text>
  </g>
  <g class="code-element" style="animation-delay: -2s">
    <text x="600" y="120" fill="url(#techGradient)" font-family="monospace" font-size="14" filter="url(#techGlow)">
      while(coding) { coffee++; }
    </text>
  </g>

  <!-- Data flow streams -->
  <g fill="none" stroke="url(#techGradient)" stroke-width="2" class="data-stream" filter="url(#techGlow)">
    <path d="M100,100 C200,50 300,150 400,100 C500,50 600,150 700,100">
      <animate attributeName="d" 
               dur="8s"
               repeatCount="indefinite"
               values="M100,100 C200,50 300,150 400,100 C500,50 600,150 700,100;
                      M100,100 C200,150 300,50 400,100 C500,150 600,50 700,100;
                      M100,100 C200,50 300,150 400,100 C500,50 600,150 700,100"/>
    </path>
  </g>

  <!-- Binary particles -->
  <g class="code-element">
    <text x="150" y="150" fill="url(#techGradient)" font-family="monospace" font-size="10" filter="url(#techGlow)" opacity="0.7">
      10011101
      <animate attributeName="opacity"
               values="0.7;0.3;0.7"
               dur="3s"
               repeatCount="indefinite"/>
    </text>
    <text x="650" y="50" fill="url(#techGradient)" font-family="monospace" font-size="10" filter="url(#techGlow)" opacity="0.7">
      01100110
      <animate attributeName="opacity"
               values="0.3;0.7;0.3"
               dur="3s"
               repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Function nodes -->
  <g transform="translate(400, 100)">
    <g class="code-element" style="animation-delay: -1.5s">
      
      <text x="-100" y="30" fill="url(#techGradient)" font-family="monospace" font-size="10" text-anchor="middle" filter="url(#techGlow)">fn()</text>
    </g>
    <g class="code-element" style="animation-delay: -2.5s">
      
      <text x="100" y="30" fill="url(#techGradient)" font-family="monospace" font-size="10" text-anchor="middle" filter="url(#techGlow)">api()</text>
    </g>
  </g>

  <!-- Main title -->
  <text x="400" y="100" text-anchor="middle" font-family="monospace" font-size="28" fill="url(#techGradient)" filter="url(#techGlow)">
    &lt;kernel-paniccc/&gt;
    <animate attributeName="font-size"
             values="28;30;28"
             dur="4s"
             repeatCount="indefinite"/>
  </text>
</svg>